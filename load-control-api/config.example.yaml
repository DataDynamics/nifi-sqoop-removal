# Load Control API 설정 예시. 복사해서 config.yaml로 쓴다(config.yaml은 git에 올리지 않는다).
#   파일 위치: LCA_CONFIG 환경변수, 없으면 현재 디렉터리의 config.yaml
#   환경변수가 같은 항목을 덮어쓴다(비밀값 주입용). 섹션 구분자는 '__'. 예: LCA_DATABASE__URL
#   모르는 키가 있으면 시작하지 않는다.
#   기간 값은 ISO 8601(PT90M, PT6H) 또는 초 단위 숫자로 쓴다.

server:                   # API HTTP 서버(python -m load_control.server)
  host: 0.0.0.0           # bind address. 같은 호스트의 프록시 뒤에만 둔다면 127.0.0.1
  port: 8080
  workers: 4              # 프로세스 수(보통 CPU 코어 수). 1보다 크면 /metrics는 프로세스별 값
  root_path: ""           # 리버스 프록시가 경로 접두사를 붙일 때(예: /load-control)
  proxy_headers: true     # X-Forwarded-For/Proto 신뢰 여부
  forwarded_allow_ips: "127.0.0.1"   # 위 헤더를 신뢰할 프록시 IP(쉼표 구분, "*" 가능)
  timeout_keep_alive: 5   # 초
  timeout_graceful_shutdown: 30      # SIGTERM 후 진행 중 요청을 기다리는 초
  limit_concurrency: null # 프로세스당 동시 연결 상한(초과 시 503). null이면 제한 없음
  # 앱에서 TLS를 직접 종료할 때만 설정한다. 보통은 LB/ingress에서 mTLS를 종료한다.
  ssl_certfile: null
  ssl_keyfile: null
  ssl_ca_certs: null      # 클라이언트 인증서 검증용 CA
  ssl_client_cert_required: false    # true면 mTLS

database:
  url: postgresql+asyncpg://load_control_api:CHANGE_ME@meta:5432/nifiops   # API 런타임 계정(DDL 권한 없음)
  migration_url: postgresql+asyncpg://nifi_ops_migrator:CHANGE_ME@meta:5432/nifiops  # alembic 전용. 없으면 url
  listen_dsn: postgresql://load_control_api:CHANGE_ME@meta:5432/nifiops     # worker LISTEN 전용. 없으면 폴링만
  pool_size: 10
  max_overflow: 5
  tx_attempts: 3          # deadlock·serialization 실패 시 트랜잭션 재실행 횟수

auth:
  # role별 Bearer 토큰 SHA-256 digest. 생성: python -m load_control.security '<token>'
  # 토큰 교체 기간에는 이전·신규 digest를 함께 둔다.
  token_digests:
    nifi:
      - "<sha256-hex>"
    operator:
      - "<sha256-hex>"

nifi:                     # worker → NiFi PG-05 호출
  receiver_url: https://nifi-lb.internal:9443
  client_cert: /etc/load-control/tls/client.crt
  client_key: /etc/load-control/tls/client.key
  ca_bundle: /etc/load-control/tls/nifi-ca.pem
  timeout_seconds: 10

recovery:                 # sweeper 기준(가이드 13.1)
  run_timeout: PT6H
  extract_query_timeout: PT60M   # NiFi EXTRACT.QUERY.TIMEOUT과 같은 값
  stale: PT90M                   # extract_query_timeout보다 커야 한다
  mode: FAIL                     # FAIL 또는 REISSUE
  max_attempts: 3                # REISSUE 모드 최대 시도
  validation_stale: PT2H
  publish_stale: PT2H
  sweeper_interval: PT1M

dispatch:                 # outbox 전달(API 설계 4장)
  max_attempts: 20
  backoff_min: PT5S
  backoff_max: PT5M
  ack_timeout: PT10M
  lease: PT60S
  poll_interval: PT5S
  batch: 20

worker:                   # python -m load_control.worker
  metrics_host: 0.0.0.0   # /metrics bind address
  metrics_port: 9100      # null이면 /metrics를 열지 않는다

logging:
  level: INFO             # root 수준: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: json            # 표준출력 형식: json(운영) 또는 console(개발)
  stdout: true            # 표준출력으로 낼지(컨테이너 로그 수집용)
  access_log: true        # API 요청마다 access 로그를 남길지(/healthz, /readyz, /metrics 제외)
  file:                   # 파일로도 낼 때. 파일은 항상 json. 필요 없으면 file: null
    path: /var/log/load-control/load-control.log
    max_bytes: 104857600  # 100MB마다 회전
    backup_count: 10
  loggers:                # logger별 수준(root보다 우선)
    sqlalchemy.engine: WARNING   # SQL을 보려면 INFO
    asyncpg: WARNING
    httpx: WARNING        # worker의 NiFi 호출. 요청마다 보려면 INFO
    httpcore: WARNING
    uvicorn.error: INFO
    alembic: INFO
    load_control: INFO    # 이 서비스 전체. 판정 과정을 자세히 보려면 DEBUG
