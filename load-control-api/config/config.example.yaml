# Load Control API 설정 예시. 복사해서 config/config.yaml로 쓴다(config.yaml은 git에 올리지 않는다).
#   파일 위치: LCA_CONFIG 환경변수, 없으면 현재 디렉터리의 config/config.yaml. bin 스크립트는 설치 디렉터리에서 실행한다
#   비밀번호 등도 이 파일에 평문으로 적는다. 파일 권한을 600으로 두고 git에 올리지 않는다.
#   환경변수가 같은 항목을 덮어쓴다. 섹션 구분자는 '__'. 예: LCA_DATABASE__URL
#   모르는 키가 있으면 시작하지 않는다.
#   기간 값은 ISO 8601(PT90M, PT6H) 또는 초 단위 숫자로 쓴다.

server:                   # API HTTP 서버(python -m load_control.server)
  host: 0.0.0.0           # bind address. 같은 호스트의 프록시 뒤에만 둔다면 127.0.0.1
  port: 8080
  workers: 4              # 프로세스 수(보통 CPU 코어 수). 1보다 크면 /metrics는 프로세스별 값이고,
                          # 여러 프로세스가 같은 로그 파일을 회전하므로 회전은 logrotate(copytruncate)에 맡기는 편이 안전하다
  root_path: ""           # 리버스 프록시가 경로 접두사를 붙일 때(예: /load-control)
  proxy_headers: true     # X-Forwarded-For/Proto 신뢰 여부
  forwarded_allow_ips: "127.0.0.1"   # 위 헤더를 신뢰할 프록시 IP(쉼표 구분, "*" 가능)
  timeout_keep_alive: 5   # 초
  timeout_graceful_shutdown: 30      # SIGTERM 후 진행 중 요청을 기다리는 초
  limit_concurrency: null # 프로세스당 동시 연결 상한(초과 시 503). null이면 제한 없음
  # NiFi↔API는 HTTP만 쓴다. 아래 TLS 항목은 비워 둔다.
  ssl_certfile: null
  ssl_keyfile: null
  ssl_ca_certs: null      # 클라이언트 인증서 검증용 CA
  ssl_client_cert_required: false    # true면 mTLS

database:
  url: postgresql+asyncpg://load_control_api:CHANGE_ME@meta:5432/nifiops   # API 런타임 계정(DDL 권한 없음)
  migration_url: postgresql+asyncpg://nifi_ops_migrator:CHANGE_ME@meta:5432/nifiops  # alembic 전용. 없으면 url
  listen_dsn: postgresql://load_control_api:CHANGE_ME@meta:5432/nifiops     # worker LISTEN 전용. 없으면 폴링만
  pool_size: 10
  max_overflow: 5
  tx_attempts: 3          # deadlock·serialization 실패 시 트랜잭션 재실행 횟수

auth:
  # role별 Bearer 토큰 SHA-256 digest. 생성: python -m load_control.security '<token>'
  # 토큰 교체 기간에는 이전·신규 digest를 함께 둔다.
  token_digests:
    nifi:
      - "<sha256-hex>"
    operator:
      - "<sha256-hex>"

nifi:                     # worker → NiFi PG-05 호출
  receiver_url: http://nifi-lb.internal:9443   # NiFi↔API는 HTTP만 쓴다(client_cert/client_key/ca_bundle 설정 안 함)
  timeout_seconds: 10

recovery:                 # sweeper 기준(가이드 13.1)
  run_timeout: PT6H
  extract_query_timeout: PT60M   # NiFi EXTRACT.QUERY.TIMEOUT과 같은 값
  stale: PT90M                   # extract_query_timeout보다 커야 한다
  mode: FAIL                     # FAIL 또는 REISSUE
  max_attempts: 3                # REISSUE 모드 최대 시도
  validation_stale: PT2H
  publish_stale: PT2H
  sweeper_interval: PT1M

cleanup:                  # 정리 대상 판정(NiFi PG-70 Cleanup이 GET /v1/cleanup/candidates로 조회)
  success_retention: P3D  # SUCCESS run의 staging table·run 경로 보존 기간(끝난 시각부터)
  failed_retention: P14D  # 실패·TIMED_OUT run(원인 확인용). PUBLISH_UNKNOWN은 확정 전까지 대상 아님
  max_batch: 200          # 한 번에 돌려줄 최대 run 수

dispatch:                 # outbox 전달(API 설계 4장)
  max_attempts: 20
  backoff_min: PT5S
  backoff_max: PT5M
  ack_timeout: PT10M
  lease: PT60S
  poll_interval: PT5S
  batch: 20

worker:                   # python -m load_control.worker
  metrics_host: 0.0.0.0   # /metrics bind address
  metrics_port: 9100      # null이면 /metrics를 열지 않는다

logging:                  # 시각은 서버 현지 시각 YYYY-MM-DD HH:MM:SS.SSS, 메시지는 한글(이벤트 코드도 함께)
  level: INFO             # root 수준: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: text            # 표준출력 형식: text(한 줄), json(수집기용), console(개발, 색상)
  stdout: false           # 표준출력으로도 낼지. bin 스크립트로 띄우면 logs/*.out에 같은 내용이 중복되므로 false.
                          # 컨테이너·systemd journal로 모을 때는 true
  access_log: true        # API 호출마다 수신(api_request)·응답(api_response) 로그를 남길지(/healthz 등 제외)
  access_body: true       # 위 로그에 요청·응답 본문(JSON)을 넣을지. Authorization 헤더는 남기지 않는다
  access_body_max: 2000   # 본문을 이 글자 수에서 자른다
  file:                   # 파일 로그. 필요 없으면 file: null
    path: logs/{service}.log      # {service}는 server 또는 worker. 설치 디렉터리 기준
    format: text          # text(사람이 읽는 한 줄) 또는 json
    max_bytes: 104857600  # 100MB마다 회전
    backup_count: 10
  loggers:                # logger별 수준(root보다 우선)
    sqlalchemy.engine: WARNING   # SQL을 보려면 INFO
    asyncpg: WARNING
    httpx: WARNING        # worker의 NiFi 호출. 요청마다 보려면 INFO
    httpcore: WARNING
    uvicorn.error: INFO
    alembic: INFO
    load_control: INFO    # 이 서비스 전체. 판정 과정을 자세히 보려면 DEBUG
