[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "load-control-api"
version = "0.1.0"
description = "Sqoop 대체 적재의 상태 원장과 완료 판정을 담당하는 Load Control API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings[yaml]>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "textual>=1.0",        # bin/monitor.sh TUI
    "oracledb>=2.0",       # bin/oracle.sh (thin 모드)
    "impyla>=0.21",        # bin/hive.sh (HiveServer2 Thrift)
]

[project.scripts]
load-control-api = "load_control.server:main"
load-control-worker = "load_control.worker.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/load_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "impala", "impala.*", "thrift", "thrift.*"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy async는 greenlet 위에서 실행되므로 greenlet 추적이 없으면 await 이후 줄이 누락된다.
concurrency = ["greenlet", "thread"]
source = ["load_control"]
branch = true
omit = ["*/worker/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
